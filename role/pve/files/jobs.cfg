vzdump: backup-vms
	schedule weekly
	enabled 1
	fleecing 0
	mode snapshot
	{# escaped so Salt's Jinja leaves Proxmox's own {{guestname}} template syntax intact -#}
	notes-template {{ '{{guestname}}' }}
	notification-mode notification-system
	prune-backups keep-last=2
	storage {{ storage }}
	vmid {{ vmids }}

