route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: prometheus_alerts_discord
  routes:
    - receiver: prometheus_muted_alerts_discord
      matchers:
        - alertname="Watchdog"
    - receiver: prometheus_muted_alerts_discord
      matchers:
        - alertname="InfoInhibitor"
    # continue: true keeps the default Discord receiver active before also duplicating to busybar
    - receiver: prometheus_alerts_discord
      matchers:
        - severity=~"critical|warning"
      continue: true
    - receiver: busybar_alerts
      matchers:
        - severity=~"critical|warning"

inhibit_rules:
  - source_matchers:
      - alertname="InfoInhibitor"
    target_matchers:
      - severity="info"
    equal:
      - namespace

receivers:
- name: prometheus_alerts_discord
  discord_configs:
  - webhook_url: '{{ webhook_url }}'
- name: prometheus_muted_alerts_discord
  discord_configs:
  - webhook_url: '{{ webhook_url_muted }}'
- name: busybar_alerts
  webhook_configs:
  - url: '{{ busybar_alert_url }}'
    send_resolved: true
    http_config:
      authorization:
        credentials: '{{ busybar_alert_token }}'
