version: "3.8"

services:
  edge:
    image: docker.io/library/nginx:1.31.3
    ports:
      - "80:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - www
      - blog
      - media
      - projects

  www:
    image: docker.io/library/nginx:1.31.3
    volumes:
      - ${CONTENT}/www/index.html:/usr/share/nginx/html/index.html:ro
      - ${CONTENT}/www/fr/index.html:/usr/share/nginx/html/fr/index.html:ro
      - ${CONTENT}/shared/robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ${CONTENT}/www/sitemap.xml:/usr/share/nginx/html/sitemap.xml:ro
      - ${CONTENT}/www/security.txt:/usr/share/nginx/html/security.txt:ro
      - ${CONTENT}/shared/404.html:/usr/share/nginx/html/404.html:ro
      - ${CONTENT}/shared/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security-headers.conf:/etc/nginx/security-headers.conf:ro

  blog:
    image: docker.io/library/nginx:1.31.3
    volumes:
      - ${CONTENT}/blog/index.html:/usr/share/nginx/html/index.html:ro
      - ${CONTENT}/blog/fr/index.html:/usr/share/nginx/html/fr/index.html:ro
      - ${CONTENT}/shared/robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ${CONTENT}/blog/security.txt:/usr/share/nginx/html/security.txt:ro
      - ${CONTENT}/shared/404.html:/usr/share/nginx/html/404.html:ro
      - ${CONTENT}/blog/feed.xml:/usr/share/nginx/html/feed.xml:ro
      - ${CONTENT}/blog/fr/feed.xml:/usr/share/nginx/html/fr/feed.xml:ro
      - ${CONTENT}/blog/posts:/usr/share/nginx/html/posts:ro
      - ${CONTENT}/blog/fr/posts:/usr/share/nginx/html/fr/posts:ro
      - ${CONTENT}/shared/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security-headers.conf:/etc/nginx/security-headers.conf:ro

  projects:
    image: docker.io/library/nginx:1.31.3
    volumes:
      - ${CONTENT}/projects/index.html:/usr/share/nginx/html/index.html:ro
      - ${CONTENT}/projects/fr/index.html:/usr/share/nginx/html/fr/index.html:ro
      - ${CONTENT}/shared/robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ${CONTENT}/projects/security.txt:/usr/share/nginx/html/security.txt:ro
      - ${CONTENT}/shared/404.html:/usr/share/nginx/html/404.html:ro
      - ${CONTENT}/shared/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security-headers.conf:/etc/nginx/security-headers.conf:ro

  media:
    image: ghcr.io/khaddict/media-khaddict:0.1.30
    volumes:
      - ${CONTENT}/media/index.html:/usr/share/nginx/html/index.html:ro
      - ${CONTENT}/media/fr/index.html:/usr/share/nginx/html/fr/index.html:ro
      - ${CONTENT}/shared/robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ${CONTENT}/media/security.txt:/usr/share/nginx/html/security.txt:ro
      - ${CONTENT}/shared/404.html:/usr/share/nginx/html/404.html:ro
      - ${CONTENT}/media/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security-headers.conf:/etc/nginx/security-headers.conf:ro
