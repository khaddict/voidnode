version: 1.0
description: No-op smoke-test workflow for validating the StackStorm/Orquesta pipeline.

tasks:
  do_nothing:
    action: core.noop
    next:
      - when: <% succeeded() %>
        publish:
          - msg: "Completed successfully."
      - when: <% failed() %>
        publish:
          - msg: "Workflow execution failed."

output:
  - msg: <% ctx().msg %>
